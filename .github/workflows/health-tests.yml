name: Health tests

# Runs the offline tests for the /health data job on pull requests that
# touch it. Uses no secrets: these tests never call Garmin.

on:
  pull_request:
    paths:
      - "scripts/health/**"
      - ".github/workflows/health*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/health/requirements.txt

      - name: Install dependencies (hash-checked)
        run: python -m pip install --require-hashes -r scripts/health/requirements.txt

      - name: Unit tests
        run: python -m pytest scripts/health
