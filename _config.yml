title: Laurence Wayne
tagline: Indie iOS &amp; Android App Developer
description: A personal website and blog where I share my creative ideas, projects, and thoughts on technology, development, and more.
url: "https://laurence-wayne.com"
baseurl: ""
lang: en-GB
timezone: Europe/London

theme: minima

author:
  name: Laurence Wayne
  twitter: solodevdude
email: hello@laurence-wayne.com
github_username: LanceWW0
twitter_username: solodevdude

twitter:
  username: solodevdude
  card: summary_large_image

social:
  name: Laurence Wayne
  links:
    - https://github.com/LanceWW0
    - https://twitter.com/solodevdude

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# /health dashboard. Read by Jekyll and by the daily data job
# (scripts/health). Anything other than `public` is treated as private.
health:
  visibility: public         # private = encrypted data + passphrase; public = open
  delay_hours: 24            # a day is published once it's this long over everywhere (min 24)
  since: 2023-01-01          # earliest date to fetch from Garmin
  metrics: [sleep, hrv, rhr, body_battery, movement, activities]

# Pages listed in the site header. Without this, minima links every page.
header_pages:
  - apps/index.md
  - blog/index.md
  - about/index.md
  # Hidden while not taking on new work — see the note in index.md.
  # - hire/index.md

defaults:
  - scope:
      path: "blog"
    values:
      image: /assets/images/me_snow.jpeg

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle/
  - vendor/
  - node_modules/
  # Python data job for /health — must never be published as static files.
  - scripts/
