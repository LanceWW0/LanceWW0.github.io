<!-- Resolve the theme before first paint. Must stay inline and synchronous
     here, above the stylesheet: deferring it produces a flash of the wrong
     theme. The try/catch is load-bearing — localStorage.getItem throws a
     SecurityError in Safari when "Block All Cookies" is on, and an uncaught
     throw would leave data-theme unset. -->
<script>
(function () {
  var d = document.documentElement, pref = null;
  try { pref = localStorage.getItem('theme-pref'); } catch (e) {}
  var dark = pref ? pref === 'dark'
                  : window.matchMedia('(prefers-color-scheme: dark)').matches;
  d.setAttribute('data-theme', dark ? 'dark' : 'light');
  // Set imperatively too: the stylesheet has not loaded yet, and the UA
  // needs color-scheme before first paint to pick the right canvas colour.
  d.style.colorScheme = dark ? 'dark' : 'light';
  var m = document.createElement('meta');
  m.name = 'theme-color';
  m.content = dark ? '#0f1115' : '#ffffff';
  d.querySelector('head').appendChild(m);
})();
</script>
