<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul class="nav-list">
        {%- for path in site.header_pages -%}
          {%- assign nav_page = site.pages | where: "path", path | first -%}
          {%- if nav_page.title -%}
            <li>
              <a class="nav-link" href="{{ nav_page.url | relative_url }}"
                 {% if page.url == nav_page.url %}aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
            </li>
          {%- endif -%}
        {%- endfor -%}
      </ul>
    </nav>

    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" hidden
            aria-pressed="false" aria-label="Switch to dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <button class="icon-btn nav-toggle" id="nav-toggle" type="button"
            aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span class="nav-toggle-box" aria-hidden="true">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </span>
    </button>
  </div>
</header>
